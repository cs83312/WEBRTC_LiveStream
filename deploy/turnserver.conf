# coturn configuration for the consultation service.
# Credentials are time-limited (TURN REST API); TURN_SECRET in the app's .env must equal static-auth-secret.

realm=consult.example.com
use-auth-secret
static-auth-secret=CHANGE_ME_TO_THE_SAME_VALUE_AS_TURN_SECRET

# Plain STUN/TURN over UDP/TCP, and TURN over TLS on 443 for hospital/corporate firewalls
# that only allow outbound HTTPS. If the app server also needs 443, give TURN its own IP.
listening-port=3478
tls-listening-port=443
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Set to the server's public IP (and private IP if behind 1:1 NAT, e.g. on a cloud VM).
# external-ip=203.0.113.10/10.0.0.5

min-port=49160
max-port=49200

fingerprint
no-cli
no-multicast-peers
stale-nonce=600

# Do not let TURN be used to reach internal networks (SSRF protection).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# One 1:1 call needs at most a few allocations; cap abuse.
user-quota=12
total-quota=1200

log-file=stdout
simple-log
