# LOCAL TESTING ONLY - do not use in production.
# Differs from ../turnserver.conf: no TLS, and private/loopback peers are allowed so two
# browsers on the same machine can be relayed. Secret and external IP come from the command line.
realm=localhost
use-auth-secret
listening-port=3478
min-port=49160
max-port=49200
fingerprint
no-cli
no-tls
no-dtls
allow-loopback-peers
log-file=stdout
simple-log
verbose
